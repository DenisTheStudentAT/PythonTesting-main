name: Python CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Install dependencies
        run: uv sync

      - name: Run tests with pytest
        run: uv run pytest