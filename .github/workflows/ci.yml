name: Python CI Pipeline

on: [push]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Install dependencies
        run: uv sync                # there was always a failure with this line. It took bit too much to find out, where can I see the description of a failure 

      - name: Run tests with pytest
        run: uv run pytest
  
  checks:
    runs-on: self-hosted

    steps:
      - name: ruff check
        run: uv run ruff check

      - name: ty check
        run: uv run ty check
      
      - name: ruff format
        run: uv run ruff format

      
      