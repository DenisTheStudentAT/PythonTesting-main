name: Python CI Pipeline

on: [push]

jobs:
  test:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests with pytest
        run: uv run --python 3.13 pytest/connect-four